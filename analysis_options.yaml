include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_use_package_imports

analyzer:
  exclude:
    - build/**
    - lib/core/ffi/generated_bindings.dart
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # вендорный форк http2: собственный analysis_options и package:test
    # из своих dev-зависимостей (см. third_party/http2/PATCHES.md)
    - third_party/**
