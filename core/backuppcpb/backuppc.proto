// Proto-контракт outbound-протокола backuppc для ядра Xray.
//
// Конфиг передается в core.OutboundHandlerConfig.ProxySettings
// (serial.TypedMessage) и материализуется registered-креатором из
// пакета core/outbound. Полное имя сообщения: backuppc.Config.
//
// V2 fields (16-23) добавлены в 2026-10 (commit protocol-v2 на branch
// protocol-v2). V2 = V1 baseline + replay-protected auth + ECH + Noise
// inner layer + QUIC fallback + uTLS fingerprint mimicry. Все V2 поля
// опциональны — V1-клиенты (бинарники собранные до добавления V2) видят
// только V1-поля (1-15) и игнорируют V2 (proto3 unknown-field rule).
syntax = "proto3";

package backuppc;

option go_package = "backuppc-core/backuppcpb";

// Config — настройки одного backuppc-outbound (соответствует
// backuppc.ClientConfig транспортной библиотеки).
message Config {
  // ─── V1 baseline (поля 1-15) ─────────────────────────────────────
  // address — адрес сервера xray-backuppc (хост[:порт], домен или IP).
  string address = 1;
  // port — TLS-порт сервера (обычно 443).
  uint32 port = 2;
  // uuid — ключ клиента: HMAC несущего канала + VLESS-аутентификация.
  string uuid = 3;
  // host — домен-донор для Host-заголовка (SNI подменяется этим же значением).
  string host = 4;
  // endpoint_paths — список несущих методов backuppc.* (ротация на чанк).
  repeated string endpoint_paths = 5;
  // user_agent — User-Agent пула BackupPC (пусто — случайный из пула).
  string user_agent = 6;
  // insecure — пропустить верификацию TLS (только тесты).
  bool insecure = 7;
  // cert_fingerprint — SHA-256 (hex) сертификата сервера: пиннинг вместо CA.
  string cert_fingerprint = 8;
  // min_padding / max_padding — диапазон случайного паддинга кадров (байты).
  uint32 min_padding = 9;
  uint32 max_padding = 10;
  // session_duration_ms — целевое время жизни сессии-чанка (мс).
  int64 session_duration_ms = 11;
  // session_bytes — лимит чанка по объему (байты).
  int64 session_bytes = 12;
  // ping_base_ms — базовый интервал keep-alive сердцебиения (мс).
  int64 ping_base_ms = 13;
  // ping_jitter_ms — разброс jitter keep-alive (мс).
  int64 ping_jitter_ms = 14;
  // balancing_interval_ms — интервал балансировщика rx/tx (мс).
  int64 balancing_interval_ms = 15;

  // ─── V2 Security Features (поля 16-23, опциональны) ─────────────
  // V2 = replay-protected auth + ECH + Noise + QUIC + uTLS.
  // Когда ВСЕ V2 поля пустые/false → клиент работает как V1 (legacy).
  // Любое V2-поле в non-default значении активирует V2 режим.

  // use_v2_auth — V2 аутентификация: X-Backup-Timestamp +
  // HMAC-SHA256(SHA256(uuid), sid|idx|tsMin). ±2-минутное окно +
  // replay guard (sync.Map, 4-мин TTL на сервере). V2 auth несовместим
  // с V1-сервером — fallback на V1 через allowed_protocols.
  bool use_v2_auth = 16;

  // ech_config_list — base64-encoded ECHConfigList (RFC 9460). Когда
  // непусто + ech_auto_fetch=false: клиент использует указанный список.
  // Когда ech_auto_fetch=true: список fetched с /api/ech-config сервера
  // до первого TLS handshake.
  string ech_config_list = 17;

  // ech_auto_fetch — авто-fetch ECHConfigList с сервера. ECH и uTLS
  // взаимоисключающие (uTLS не поддерживает ECH extension). Когда
  // ech_auto_fetch=true → ut_fingerprint игнорируется.
  bool ech_auto_fetch = 18;

  // noise_pub_key — публичный X25519 ключ сервера (hex, 64 символа) для
  // Noise IK inner layer (X25519+ChaCha20-Poly1305+BLAKE2s). Когда
  // непусто: после TLS handshake, клиент делает Noise IK handshake с
  // сервером; все последующие bytes идут через Noise AEAD. Защита от
  // MITM и post-quantum passive attack (X25519 + BLAKE2s).
  string noise_pub_key = 19;

  // quic_fallback — HTTP/3 over QUIC (UDP) fallback когда TCP HTTP/2
  // заблокирован ТСПУ. Когда true: клиент пытается QUIC dial перед TCP.
  // utls не поддерживает QUIC — QUIC mode использует native crypto/tls.
  bool quic_fallback = 20;

  // ut_fingerprint — uTLS JA3 fingerprint: chrome|firefox|safari|ios|random.
  // Когда непусто: клиент использует uTLS UClient вместо stdlib TLS.
  // uTLS имитирует ClientHello браузера — защита от JA3-based DPI.
  // Отключено когда ech_auto_fetch=true (ECH несовместим с uTLS).
  string ut_fingerprint = 21;

  // utls_tunnel_path — путь к utls-tunnel sidecar binary. Когда непусто:
  // outbound spawnит utls-tunnel как локальный TCP-relay, весь трафик
  // идёт через sidecar (который делает uTLS/ECH/Noise/QUIC). Когда пусто:
  // V2 фичи активны только в транспортной библиотеке backuppc.
  string utls_tunnel_path = 22;

  // allowed_protocols — какие auth-протоколы разрешены этому пользователю.
  // Пустой список = оба (V1 и V2). ["v2"] = V2-only (V1 отклоняется сервером).
  // ["v1"] = V1-only (V2 auth заголовки не отправляются).
  // Сервер использует это для per-user policy enforcement.
  repeated string allowed_protocols = 23;

  // user_token — V2 user token (audit 2026-10-14). Заменяет uuid в V2
  // протоколе. 32 байта, hex-encoded (64 chars), сервер-выданный случайный
  // токен. НЕ UUID — V2 протокол полностью убирает UUID из клиентского
  // конфига. VLESS UUID выводится на сервере детерминистически = token[:16].
  //
  // Когда use_v2_auth=true AND user_token непустой:
  //   - HMAC key для X-Backup-Auth = user_token bytes (32 байта, без SHA256).
  //   - VLESS UUID (для VLESS handshake) = token[:16] (выводится клиентом).
  //   - Сервер смотрит user_token, находит user по токену, использует token[:16]
  //     как ожидаемый VLESS UUID.
  //
  // Когда use_v2_auth=true AND user_token пустой (legacy V2 path):
  //   - Fallback на старый V2 path: HMAC key = SHA256(uuid string).
  //   - Используется только для back-compat с уже развёрнутыми V2 клиентами.
  //   - При первой возможности мигрировать на user_token.
  //
  // Когда use_v2_auth=false (V1 mode):
  //   - user_token игнорируется, используется uuid (proto field 3) как раньше.
  string user_token = 24;
}
