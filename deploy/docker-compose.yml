# backuppc-client — безголовый клиент туннеля (Docker Compose).
#
# Требует собранного образа:
#   docker build -f deploy/Dockerfile -t backuppc-client .
#
# Затем:
#   BACKUPPC_SERVER=vpn.example.com:8443 \
#   BACKUPPC_UUID=01234567-... \
#   docker compose -f deploy/docker-compose.yml up -d
#
# Локальный SOCKS5: 127.0.0.1:1080 (пример браузера/приложения).
# Проверка: curl --socks5-hostname 127.0.0.1:1080 https://ifconfig.me

services:
  backuppc-client:
    image: backuppc-client:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: backuppc-client
    restart: unless-stopped
    environment:
      BACKUPPC_SERVER: ${BACKUPPC_SERVER:?укажите адрес сервера host:port}
      BACKUPPC_UUID: ${BACKUPPC_UUID:?укажите UUID пользователя из панели}
      # BACKUPPC_HOST: backup.local        # домен-донор SNI/Host
      # BACKUPPC_CERT_FP: ""               # SHA-256 сертификата (пиннинг)
      # BACKUPPC_ENDPOINTS: "/backuppc.BackupService/BackupStream,..."
      # BACKUPPC_LOGLEVEL: info
    ports:
      - "127.0.0.1:1080:1080"
    # альтернатива генерации из env — смонтированный готовый конфиг:
    # volumes:
    #   - ./xray.example.json:/etc/backuppc/xray.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn 2>/dev/null | grep -q :1080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
