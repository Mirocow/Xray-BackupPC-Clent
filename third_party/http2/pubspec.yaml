name: http2
version: 3.1.0+backuppc.1
description: >-
  A HTTP/2 implementation in Dart (vendored fork for backuppc_dart
  with flow-control performance patches, see PATCHES.md).
repository: https://github.com/dart-lang/http/tree/master/pkgs/http2

environment:
  # Relaxed from ^3.7.0 → ^3.0.0 to support macOS 13 (Ventura) + Flutter
  # 3.24.5 (Dart 3.5.4). The fork's source uses standard Dart 3.0 syntax,
  # no 3.7+ features (verified by quick scan of lib/).
  sdk: ^3.0.0

dependencies:
  # Pinned to ^1.18.0 (was ^1.19.0) to match flutter_test SDK pin on
  # collection 1.18.0.
  collection: ^1.18.0
  meta: ^1.15.0
  pool: ^1.5.0
