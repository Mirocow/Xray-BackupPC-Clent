name: onexray
description: "Cross Platform Xray-core Client"
publish_to: "none"
version: 26.9.3+1

environment:
  # Lowered from 3.13.0 → 3.5.0 to support macOS 13 (Ventura) where the
  # last compatible Flutter is 3.24.5 (ships Dart 3.5.4). All deps pinned
  # below to versions compatible with Dart 3.5.4.
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # material_ui: no Dart-3.5.4-compatible version on pub.dev.
  # Using local fork at packages/material_ui with relaxed SDK constraint.
  material_ui:
    path: packages/material_ui

  #---------- flutter.dev plugin
  # macOS 13 (Ventura) pins: latest versions compatible with Dart 3.5.4.
  # See docs/macos-13-build.md for rationale + maintenance plan.
  path_provider: ^2.1.5          # was ^2.1.6 (>=3.10.0)
  shared_preferences: ^2.5.3     # was ^2.5.5 (^3.11.0)
  url_launcher: ^6.3.1          # was ^6.3.2 (^3.11.0)
  quick_actions: ^1.1.0         # was ^1.1.1 (>=3.10.0)
  go_router: ^15.1.2             # was ^18.0.1 (^3.12.0)
  image_picker: ^1.1.0          # was ^1.2.3 (^3.11.0) — need to verify API compat
  process: ^5.0.6               # already compatible (^3.5.0)
  webview_flutter: ^4.10.0      # was ^4.14.1 (^3.10.0)
  app_links: ^6.4.1             # was ^7.2.1 (^3.12.0)

  #---------- dart.dev plugin
  # core
  # Pinned to ^1.9.0 (not ^1.9.1) to match flutter_test's SDK pin on
  # path 1.9.0 — ^1.9.1 would conflict with flutter_test from sdk.
  path: ^1.9.0

  # backuppc protocol (pure Dart — all OneXray platforms build)
  backuppc_dart:
    path: backuppc_dart
  # mesh-расширение (MeshSession, MeshPeersPage, MeshPicker)
  backuppc_mesh:
    path: packages/backuppc_mesh
  # Pinned to ^1.18.0 (not ^1.19.1) to match flutter_test SDK pin on
  # collection 1.18.0. The code uses only basic List/Map APIs that
  # haven't changed since 1.18.0.
  collection: ^1.18.0
  crypto: ^3.0.7
  pub_semver: ^2.2.1
  # i18n
  intl: ^0.19.0                 # was ^0.20.3 — lowered to satisfy flutter_localizations' pin on intl 0.19.0
  # native
  ffi: ^2.1.3                  # was ^2.2.0 (>=3.7.0)

  #---------- google.dev plugin
  json_annotation: ^4.9.0       # was ^4.12.0 (^3.9.0)
  tuple: ^2.0.2

  #---------- flutter community
  package_info_plus: ^9.0.1    # was ^10.2.1 (>=3.10.0)
  share_plus: ^12.0.2          # was ^13.3.0 (>=3.10.0)

  #---------- third party plugin
  # Pinned to ^2.31.0 (was ^2.32.1) — drift >=2.32.0 transitively
  # requires sqlite3 ^3.1.5 which requires Dart >=3.9.999 (effectively
  # >=3.10.0, incompatible with our 3.5.4). 2.31.0 is the last version
  # compatible with sqlite3 ^2.6.0 (satisfied by our sqlite3 ^2.9.4).
  # drift_dev 2.32.1 still works (its constraint is drift >=2.30.0 <2.33.0).
  drift: ^2.31.0
  # Pinned to ^0.2.6 (was ^0.3.0) — drift_flutter 0.3.0 transitively
  # requires sqlite3 ^3.0.0 which requires Dart >=3.10.0 (incompatible
  # with our 3.5.4). 0.2.8 is the last version compatible with both
  # Dart 3.5.0+ AND sqlite3 ^2.4.6 (which we satisfy via sqlite3 ^2.9.4).
  drift_flutter: ^0.2.6
  sqlite3: ^2.9.4             # was ^3.5.2 (>=3.10.0) — major API compat risk

  dio: ^5.11.1
  uuid: ^4.6.0
  permission_handler: ^12.0.3  # was ^13.0.2 (^3.6.0)
  # qrcode
  file_picker: ^11.0.3        # was ^12.2.0 (>=3.4.0)
  icloud_storage_plus: 4.0.0   # already compatible (>=3.0.0)
  saf_stream: ^2.0.0          # was 4.0.1 (^3.12.0) — major downgrade
  mobile_scanner: ^7.0.0-beta.5  # was ^7.4.1 (>=3.4.0) — only beta supports 3.5
  image: ^4.9.2
  zxing2: ^0.2.4
  # export
  # state management
  flutter_bloc: ^9.1.1
  # Pinned to ^0.16.3 — last version compatible with Flutter 3.24.5.
  # All versions 0.17.0+ require Flutter >=3.41.0 (incompatible with macOS 13).
  # MAJOR downgrade from 0.56.3 — API has changed significantly, expect
  # compile errors in lib/ that use newer shadcn_ui APIs.
  shadcn_ui: ^0.16.3
  lucide_icons_flutter: ^3.1.19
  # markdown
  # Pinned to 1.0.0+1 — only version compatible with Flutter 3.24.5.
  # All versions 1.0.1+ require Flutter >=3.27.1 (incompatible with macOS 13).
  flutter_markdown_plus: 1.0.0+1
  flutter_local_notifications: ^19.5.0  # was ^22.3.0 (^3.4.0)
  in_app_review: ^2.0.12

  isolate_manager: ^6.1.1     # was ^6.3.2 (>=3.7.0)

  # editor
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # desktop
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  win32: ^5.10.1              # was ^6.4.0 (^3.10.0) — major downgrade

dev_dependencies:
  flutter_test:
    sdk: flutter
  share_plus_platform_interface: ^6.1.0  # was ^7.2.0 (>=3.10.0)
  build_runner: ^2.4.13         # was ^2.16.1 (^3.11.0)
  json_serializable: ^6.9.0    # was ^6.14.1 (^3.9.0)
  drift_dev: ^2.32.1           # was ^2.35.0 (>=3.10.0)
  pigeon: ^25.3.2              # was ^28.1.0 (^3.11.0) — major downgrade
  flutter_lints: ^5.0.0        # was ^6.0.0 (^3.8.0)
  # Pinned to ^5.13.0 (was ^5.15.0) — flutter_gen_runner >=5.14.0
  # directly depends on build_config ^1.1.2 which requires Dart >=3.6.0
  # (we have 3.5.4). 5.13.0+1 is the last version compatible with our
  # Dart — doesn't directly depend on build_config, pulls older
  # compatible versions transitively.
  flutter_gen_runner: ^5.13.0
  ffigen: ^19.0.0              # was ^22.0.0 (>=3.10.0)
  msix: ^3.18.0                # already compatible (>=2.19.0)

# re_editor only uses APIs that remain compatible with isolate_manager 6.x.
dependency_overrides:
  isolate_manager: ^6.1.1     # was ^6.3.2 — same as direct dep
  # Force lucide_icons_flutter 3.x even though shadcn_ui 0.16.3 transitively
  # wants ^1.1.0. shadcn_ui only USES Icon widgets (Flutter SDK API), not
  # lucide-specific classes — so the 1.x→3.x upgrade shouldn't break
  # shadcn_ui source compilation. Project code uses 3.x icon names.
  lucide_icons_flutter: ^3.1.19

msix_config:
  display_name: OneXray
  publisher_display_name: Yuan Dev LLC
  identity_name: YuanDevLLC.OneXray
  publisher: CN=3666BCB5-5482-46DD-9C19-D8A7290A39FD
  logo_path: assets/logo.png
  protocol_activation: onexray
  languages: en-us
  capabilities: internetClientServer, privateNetworkClientServer, networkingVpnProvider
  startup_task:
    task_id: VCoreStartup
    enabled: false
  os_min_version: 10.0.19042.0
  build_windows: false
  store: true

flutter_gen:
  output: lib/gen/

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/dat/
    - assets/geodata/regions.json
    - assets/icon/
    - assets/app_icon/
    - assets/macos_icon/

ffigen:
  name: NativeLibrary
  description: Generated native bindings for libXray and VCore.
  llvm-path:
    - "C:\Program Files\LLVM"
    - "/home/z/tools"
  output: "lib/core/ffi/generated_bindings.dart"
  compiler-opts:
    - "-D_WIN32"
  exclude-all-by-default: true
  headers:
    entry-points:
      - "c/include/libXray.h"
      - "c/include/vcore.h"
  functions:
    include:
      - "CGoInvoke"
      - "CGoFree"
      - "VCoreWindowsVpnInvoke"
      - "VCoreFree"
