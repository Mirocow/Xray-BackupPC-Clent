name: backuppc_mesh
description: >-
  Mesh extension for backuppc_dart (v1.4-mesh): decentralized mesh network
  with privacy per-hop. Each node knows only its directly-configured peers.
  Multi-hop chains via re-dial pattern (no VLESS addon 0x4D — back-compat preserved).
  Ed25519 peer signatures via package:cryptography (FlutterFire, native crypto).
version: 0.1.0-alpha
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # Path goes up 2 levels: packages/backuppc_mesh → packages → repo root,
  # then into backuppc_dart. Was ../backuppc_dart (1 level) which resolved
  # to packages/backuppc_dart/ — directory doesn't exist.
  backuppc_dart:
    path: ../../backuppc_dart
  cryptography: ^2.7.0
  # Bumped from ^1.0.0 → ^2.3.4: 1.0.0 is not null-safe (requires Dart
  # <3.0.0), conflicts with our Dart 3.5.4. 2.3.4 is the latest version
  # compatible with both Dart 3.5.4 and Flutter 3.24.5. Major API risk
  # between 1.x and 2.x — backuppc_mesh source may need adjustment.
  cryptography_flutter: ^2.3.4

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
