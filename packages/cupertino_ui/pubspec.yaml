name: cupertino_ui
description: The official Flutter Cupertino Design Library, implementing the iOS design system.
version: 1.0.0-fork-ventura
repository: https://github.com/flutter/packages/tree/main/packages/cupertino_ui
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A%20cupertino%22

# FORK NOTE: Local fork with SDK constraint relaxed from ^3.12.0 → ^3.5.0
# to support macOS 13 (Ventura). See packages/material_ui/pubspec.yaml.
environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  # Pinned to ^1.18.0 to match flutter_test SDK pin on collection 1.18.0.
  collection: ^1.18.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0                 # match flutter_localizations pin

dev_dependencies:
  clock: ^1.1.2
  flutter_test:
    sdk: flutter
  # To track memory leaks.
  leak_tracker_flutter_testing: ^3.0.10
  material_ui: ^1.0.0
  path: ^1.9.1

topics:
  - ui
  - widgets
  - cupertino
  - ios
