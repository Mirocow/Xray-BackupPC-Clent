name: material_ui
description: The official Flutter Material UI Library, implementing Google's Material Design design system.
version: 1.2.0-fork-ventura
repository: https://github.com/flutter/packages/tree/main/packages/material_ui
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A%20material%20design%22

# FORK NOTE: This is a local fork of material_ui 1.2.0 with the SDK
# constraint relaxed from ^3.12.0 → ^3.5.0 to support macOS 13
# (Ventura) where the last compatible Flutter is 3.24.5 (Dart 3.5.4).
# If the package source uses 3.12+ syntax (extension types, sealed
# classes, etc.) this will surface as compile errors. See
# docs/macos-13-build.md for risk assessment.
environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  # Pinned to ^1.18.0 to match flutter_test SDK pin on collection 1.18.0.
  collection: ^1.18.0
  # cupertino_ui also has Dart-version constraints; relax at fork level.
  cupertino_ui:
    path: ../cupertino_ui
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0                 # match flutter_localizations pin
  # Pinned to ^0.11.1 to match flutter_test SDK pin on
  # material_color_utilities 0.11.1. material_ui 1.2.0 source may use
  # APIs from 0.13.0+ — if so, we'll need dependency_overrides in
  # the host project to force a newer version.
  material_color_utilities: ^0.11.1
  # Pinned to ^2.1.4 to match flutter_test SDK pin on vector_math 2.1.4.
  vector_math: ^2.1.4

dev_dependencies:
  args: ^2.7.0
  file: ^7.0.1
  flutter_test:
    sdk: flutter
  # To track memory leaks.
  leak_tracker_flutter_testing: ^3.0.10
  meta: ^1.18.0
  path: ^1.9.1
  platform: ^3.1.6

flutter:
  shaders:
    - packages/material_ui/shaders/ink_sparkle.frag

topics:
  - ui
  - widgets
  - material
