name: backuppc_dart
description: >-
  Нативная Dart-реализация клиентского протокола xray-vless-backuppc:
  VLESS поверх gRPC/HTTP2+TLS с маскировкой под поток периодических
  бекапов BackupPC. Транспортная библиотека + SOCKS5-туннель.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # вендорный форк с патчами производительности флоу-контроля
  # (окно соединения 32 МиБ + батчинг WINDOW_UPDATE, см. PATCHES.md):
  # 7 → ~54 МиБ/с через один POST-стрим — запас для 8K-видео
  http2:
    path: ../third_party/http2
  crypto: ^3.0.0
  convert: ^3.1.0

dev_dependencies:
  test: ^1.25.0
